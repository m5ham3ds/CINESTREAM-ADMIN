name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode debug.keystore
      run: |
        echo "" | base64 -d > debug.keystore

    - name: Setup google-services.json
      run: |
        if [ ! -f "app/google-services.json" ]; then
          echo "google-services.json not found in repository, creating from canonical configuration..."
          echo "" | base64 -d > app/google-services.json
        else
          echo "app/google-services.json is already present."
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk "CineStream Admin.apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CineStream Admin
        path: "CineStream Admin.apk"
